<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">China's Loan Prime Rate change</title>
  <desc id="description">Step chart of 1-year and over-five-year Loan Prime Rates from August 2019 to July 2026. Each point aligns to the annual-rate percentage axis at left.</desc>
